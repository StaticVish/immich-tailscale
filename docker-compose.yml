name: immich

volumes:
  immich-ts:
    driver: local
  caddy-data:
    driver: local
  model-cache:
    driver: local

services:
  # 1. Dedicated Tailscale Node (Registers as immich.kingfisher-noodlefish.ts.net)
  ts:
    image: ghcr.io/tailscale/tailscale:v1.102.3
    hostname: immich
    container_name: immich_ts
    volumes:
      - immich-ts:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/lib/tailscale/tailscaled.sock
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  # 2. Caddy Reverse Proxy (Provides HTTPS with Auto-TLS for Tailscale)
  caddy:
    image: ghcr.io/tailscale/caddy-tailscale:main
    container_name: immich_caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - immich-ts:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKET=/var/lib/tailscale/tailscaled.sock
    restart: unless-stopped
    network_mode: service:ts
    depends_on:
      - ts

  # 3. Immich Core Server & Web Application
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # Primary photo upload & storage location on NAS RAID array
      - ${UPLOAD_LOCATION}:/data
      # Host timezone mapping
      - /etc/localtime:/etc/localtime:ro
      # External Library Mount: Allows Immich to scan existing photos on the NAS without re-uploading
      - /mnt/NAS/users/vvisveswaran:/mnt/external/vvisveswaran:ro
    environment:
      - DB_HOSTNAME=127.0.0.1
      - DB_PORT=5432
      - REDIS_HOSTNAME=127.0.0.1
      - REDIS_PORT=6379
      - IMMICH_MACHINE_LEARNING_URL=http://127.0.0.1:3003
    env_file:
      - .env
    restart: always
    network_mode: service:ts
    depends_on:
      - ts
      - redis
      - database

  # 4. Immich Machine Learning (ARM64 CPU Inference)
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    network_mode: service:ts
    depends_on:
      - ts

  # 5. Redis / Valkey Cache & Queue Engine
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: always
    network_mode: service:ts
    depends_on:
      - ts

  # 6. PostgreSQL Database with Vector Support
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      # Database MUST live on the local NVMe SSD (/dev/nvme0n1p2)
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 256mb
    restart: always
    network_mode: service:ts
    depends_on:
      - ts
